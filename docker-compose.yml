services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: file:/data/app.db
      UPLOAD_DIR: /data/uploads
      PROCESSING_DIR: /data/processing
      REPORT_DIR: /data/reports
    volumes:
      - app-data:/data
    mem_limit: 1400m
    cpus: 1.75
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/ocr-usage').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 20s
      timeout: 5s
      retries: 5

  nginx:
    build: ./deploy/nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/certs:/etc/nginx/certs
    mem_limit: 128m

volumes:
  app-data:
