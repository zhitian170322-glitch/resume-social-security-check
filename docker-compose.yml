services:
  app:
    container_name: resume-social-security-check-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: file:/data/app.db
      UPLOAD_DIR: /data/uploads
      PROCESSING_DIR: /data/processing
      REPORT_DIR: /data/reports
    volumes:
      - app-data:/data
    expose:
      - "3000"
    ports:
      - "127.0.0.1:${APP_PORT:-3100}:3000"
    mem_limit: 1400m
    cpus: 1.75
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/ocr-usage').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 20s
      timeout: 5s
      retries: 5

volumes:
  app-data:
